# Docker's embedded DNS; short TTL so new/removed containers are picked up fast
resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 80;

    # Lab-only endpoints are not reachable by clients
    location ~ ^/(metrics|cpu|mem|fail-health|recover-health|crash) {
        return 403;
    }

    location / {
        # Using a variable forces Nginx to re-resolve "app" at request time
        set $upstream http://app:5000;
        proxy_pass $upstream;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502;
        proxy_set_header Host $host;
    }
}
