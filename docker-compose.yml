name: shi

services:
  app:
    build: ./app
    image: self-healing-app:latest
    restart: "no"          # recovery is the healer's job, not Docker's
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks: [appnet]

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped
    networks: [appnet]

networks:
  appnet:
    name: shi_appnet
